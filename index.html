<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Valentine 2026 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  padding: 35px 25px;
  border-radius: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  text-align: center;
  max-width: 350px;
  width: 90%;
  position: relative;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  margin-bottom: 25px;
  color: #d63384;
}

.buttons {
  position: relative;
  height: 120px;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s ease;
  position: absolute;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  left: 20%;
  box-shadow: 0 8px 20px rgba(255,77,109,0.5);
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: #adb5bd;
  color: white;
  right: 20%;
}

#result {
  display: none;
  flex-direction: column;
  align-items: center;
}

#result h2 {
  font-family: 'Playfair Display', serif;
  color: #d63384;
}

img {
  width: 100%;
  border-radius: 20px;
  margin-top: 15px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.hearts span {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  animation: float 6s infinite ease-in;
  color: rgba(255,255,255,0.8);
}

@keyframes float {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
}
</style>
</head>

<body>

<div class="hearts">
  <span style="left:10%; animation-delay:0s;">💖</span>
  <span style="left:30%; animation-delay:2s;">💕</span>
  <span style="left:50%; animation-delay:4s;">💗</span>
  <span style="left:70%; animation-delay:1s;">💘</span>
  <span style="left:85%; animation-delay:3s;">❤️</span>
</div>

<div class="card" id="questionCard">
  <h1>Will you be my Valentine in 2026? 💖</h1>
  <div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 🙈</button>
  </div>
</div>

<div class="card" id="result">
  <h2>You chose the best option ❤️</h2>
  <p>I love you more than words can explain.</p>

  <img src="photo.jpg" alt="Us together" />

  <p style="margin-top:15px; font-weight:500;">
    Happy Valentine's 2026 My Lady💞
  </p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const questionCard = document.getElementById("questionCard");
const result = document.getElementById("result");

function moveButton() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 60;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

yesBtn.addEventListener("click", () => {
  questionCard.style.display = "none";
  result.style.display = "flex";
});
</script>

</body>
</html>
